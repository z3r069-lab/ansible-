---
# tasks file for deploy_apache
- name: check Linux family
  debug:
    var: ansible_os_family

- block: #==============BLOCK FOR REDHAT==============#

  - name: install apache for RedHat
    yum:
      name: httpd
      state: latest

  - name: start service (Apache) on RedHat
    service:
      name: httpd
      state: started
      enabled: true
    notify: Restart Apache on RedHat

  when: ansible_os_family == "RedHat"
#+++++++++++++++END BLOCK++++++++++++++++++++++++

- block: #=====BLOCK FOR UBUNTU==========

  - name: install Apache for Ubuntu
    apt:
      name: apache2
      state: latest

  - name: start service (Apache) on Ubuntu
    service:
      name: apache2
      state: started
      enabled: true
    notify: Restart Apache on Ubuntu

  when: ansible_os_family == "Debian"
#++++++++++++++++END BLOCK+++++++++++++++++++++++++++