- name: deploy config 
  copy: 
    src: "{{'node1' if 'postgress1' in inventory_hostname else 'node2'}}etcd.env"
    dest: /etc/etcd/etcd.env
    

- name: deploy service
  copy: 
    src: etcd.service
    dest: /etc/systemd/system/etcd.service

#- name: Create directory for etcd ETCD_DATA_DIR
#  ansible.builtin.file:
#    path: /var/lib/etcd 
#    state: directory

- name: Create directory for etcd ETCD_DATA_DIR
  shell: |
    mkdir -p /var/lib/etcd 
    chown -R etcd:etcd /var/lib/etcd
  become: yes

- name: Reload systemd manager configuration
  ansible.builtin.command:
    cmd: systemctl daemon-reload
  become: yes

- name: Enable the etcd service to start on boot
#  ansible.builtin.systemd:
#    name: etcd
#    enabled: yes
#    state: started
#  become: yes
  shell: |
    systemctl daemon-reload
    systemctl enable etcd

- name: check status
  #ansible.builtin.command:
  #  cmd: systemctl status etcd
  #become: yes
  shell: |
    systemctl start etcd
    systemctl status etcd
  become: yes
  register: status_output

- name: display status
  debug: 
    var: status_output

- name: check health
  ansible.builtin.shell:
    cmd: etcdctl --endpoints=https://127.0.0.1:2379   --cacert=/etc/etcd/ssl/ca.crt   --cert=/etc/etcd/ssl/etcd-{{'node1' if 'postgress1' in inventory_hostname else 'node2'}}.crt   --key=/etc/etcd/ssl/etcd-{{'node1' if 'postgress1' in inventory_hostname else 'node2'}}.key  endpoint health
  become: yes
  register: health_output

- name: display health
  debug: 
    var: health_output

- name: List etcd cluster members
  shell: etcdctl --endpoints=https://127.0.0.1:2379   --cacert=/etc/etcd/ssl/ca.crt   --cert=/etc/etcd/ssl/etcd-{{'node1' if 'postgress1' in inventory_hostname else 'node2'}}.crt   --key=/etc/etcd/ssl/etcd-{{'node1' if 'postgress1' in inventory_hostname else 'node2'}}.key  member list
  register: etcd_members
  become: yes


- name: Show etcd members
  debug:
    var: etcd_members.stdout_lines

