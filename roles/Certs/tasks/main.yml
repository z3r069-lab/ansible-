---
# tasks file for Certs
- name: generating certificates 
  command: /home/osbeers/ansible/certs.sh
  become: yes
  become_method: sudo
  become_user: osbeers
  run_once: true
  delegate_to: localhost
  register: script_output
  vars:
    ansible_become_password: "{{ sudo_password }}"
  

- name: show output
  debug:
    var: script_output
  run_once: true 
  delegate_to: localhost

  
- name: moving serts to postgress 1
  ansible.builtin.copy:
    src: "certs/{{ item }}"
    dest: /tmp
    remote_src: no 
  loop:
    - ca.crt
    - etcd-node1.crt
    - etcd-node1.key
  when: " 'postgress1' in inventory_hostname"

- name: moving serts to postgress 2
  ansible.builtin.copy:
    src: "certs/{{ item }}"
    dest: /tmp
    remote_src: no 
  loop:
    - ca.crt
    - etcd-node2.crt
    - etcd-node2.key
  when: " 'postgress2' in inventory_hostname"


- name: moving files
  shell: |
    sudo mkdir -p /etc/etcd/ssl
    mv /tmp/etcd-node*.crt /etc/etcd/ssl/
    mv /tmp/etcd-node*.key /etc/etcd/ssl/
    mv /tmp/ca.crt /etc/etcd/ssl/
    chown -R etcd:etcd /etc/etcd/
    chmod 600 /etc/etcd/ssl/etcd-node*.key
    chmod 644 /etc/etcd/ssl/etcd-node*.crt /etc/etcd/ssl/ca.crt
  become: yes

